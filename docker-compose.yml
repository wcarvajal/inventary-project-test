version: '4.31.1'

services:
  products:
    build:
      context: ./products-service
      dockerfile: docker/php/Dockerfile
    ports:
      - "8001:80"
    volumes:
      - ./products-service:/var/www/html
    environment:
      APP_ENV: production
      DB_HOST: localhost
      SERVICE_API_KEY: secret-products-key
    networks:
      - backend

  inventory:
    build:
      context: ./inventory-service
      dockerfile: docker/php/Dockerfile
    ports:
      - "8002:80"
    environment:
      APP_ENV: production
      PRODUCTS_SERVICE_URL: http://products
      PRODUCTS_API_KEY: secret-products-key
    networks:
      - backend

  db_products:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: products
      MYSQL_USER: user
      MYSQL_PASSWORD: secret
    networks:
      - backend

  db_inventory:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory
      MYSQL_USER: user
      MYSQL_PASSWORD: secret
    networks:
      - backend

networks:
  backend:
    driver: bridge