name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USERNAME: root
  DB_PASSWORD: ''

jobs:
  products-service:
    name: Products Service Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: products
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, zip, mysql, xml
        coverage: pcov

    - name: Copy .env
      run: |
        cp products-service/app/.env.example products-service/app/.env
        sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' products-service/app/.env
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=products/' products-service/app/.env
        # Generar APP_KEY
        echo "APP_KEY=base64:$(openssl rand -base64 32)" >> products-service/app/.env

    - name: Install Dependencies
      working-directory: ./products-service/app/
      run: |
        composer install --prefer-dist --no-interaction

    - name: Run Migrations
      working-directory: ./products-service/app/
      run: |
        php artisan migrate --force

    - name: Execute Tests
      working-directory: ./products-service/app/
      run: |
        php artisan test --coverage --min=80

  inventory-service:
    name: Inventory Service Tests
    runs-on: ubuntu-latest
    needs: products-service
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: inventory
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, zip, mysql, xml
        coverage: pcov

    - name: Copy .env
      run: |
        cp inventory-service/app/.env.example inventory-service/app/.env
        sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' inventory-service/app/.env
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=inventory/' inventory-service/app/.env
        sed -i 's/PRODUCTS_SERVICE_URL=.*/PRODUCTS_SERVICE_URL=http:\/\/localhost:8001/' inventory-service/app/.env
        echo "APP_KEY=base64:$(openssl rand -base64 32)" >> inventory-service/app/.env
        sed -i 's/PRODUCTS_SERVICE_URL=.*/PRODUCTS_SERVICE_URL=http:\/\/localhost:8001/' inventory-service/app/.env

    - name: Install Dependencies
      working-directory: ./inventory-service/app/
      run: |
        composer install --prefer-dist --no-interaction

    - name: Run Migrations
      working-directory: ./inventory-service/app/
      run: |
        php artisan migrate --force

    - name: Execute Tests
      working-directory: ./inventory-service/app/
      run: |
        php artisan test --coverage --min=80